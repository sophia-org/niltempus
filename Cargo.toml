[workspace]
members = ["crates/xtask", "crates/live-tests"]
resolver = "3"

[workspace.package]
authors = ["Mason Austin Green"]
edition = "2024"
license = "BSD-3-Clause"
version = "0.1.0"
rust-version = "1.96"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
new_without_default = "allow"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }
sha2 = "0.10.9"
# Sophia's public crates, pinned to one revision by its canonical URL. No
# sibling path is ever named: tools/provision.sh redirects the URL to a local
# clone only while vendoring, and every gate then builds --offline --locked
# from .provision/vendor. See pins/sophia.toml.
sophia-protocol = { git = "https://github.com/sophia-org/sophia.git", rev = "9fcaec782ce4fe9978568c0466ee17a78b3d4571" }
sophia-runtime = { git = "https://github.com/sophia-org/sophia.git", rev = "9fcaec782ce4fe9978568c0466ee17a78b3d4571" }
