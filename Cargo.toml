[workspace]
members = [
    "crates/xtask",
    "crates/live-tests",
    "crates/desktop-comparison",
    "crates/quickshell-probe",
]
resolver = "3"

[workspace.package]
authors = ["Mason Austin Green"]
edition = "2024"
license = "BSD-3-Clause"
version = "0.1.0"
rust-version = "1.96"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
new_without_default = "allow"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }
sha2 = "0.10.9"
# Sophia's public crates, pinned to one revision by its canonical URL. No
# sibling path is ever named: tools/provision.sh redirects the URL to a local
# clone only while fetching, and every gate then builds --offline --locked
# from an explicit private CARGO_HOME outside this tree. See pins/sophia.toml.
# The public session-log record reader (seam B). Only an exact git checkout
# builds this package (its conformance-host bins use ../ paths), so
# provisioning fetches into a private CARGO_HOME rather than `cargo vendor`.
sophia-conformance = { git = "https://github.com/sophia-org/sophia.git", rev = "e51a17b8681123a53ca3f7b632c35dbe71e3a4ee" }
# The public desktop-profile loader, for the moved dock profile test (it was a
# dev-dependency of Sophia's sophia-conformance).
sophia-config = { git = "https://github.com/sophia-org/sophia.git", rev = "e51a17b8681123a53ca3f7b632c35dbe71e3a4ee" }
sophia-protocol = { git = "https://github.com/sophia-org/sophia.git", rev = "e51a17b8681123a53ca3f7b632c35dbe71e3a4ee" }
sophia-runtime = { git = "https://github.com/sophia-org/sophia.git", rev = "e51a17b8681123a53ca3f7b632c35dbe71e3a4ee" }
# The Rust desktop SDK's shell client, as vendored by Sophia at the same pin:
# the neighbour bar in the live Bemenu gate (9P).
sophia-shell-client = { git = "https://github.com/sophia-org/sophia.git", rev = "e51a17b8681123a53ca3f7b632c35dbe71e3a4ee" }
# The Engine's public types, for the desktop comparison, at the same pin.
sophia-engine = { git = "https://github.com/sophia-org/sophia.git", rev = "e51a17b8681123a53ca3f7b632c35dbe71e3a4ee" }
# The public X server frontend, for the moved Quickshell trace probe
# (crates/quickshell-probe, docs/quickshell.md).
sophia-x-authority = { git = "https://github.com/sophia-org/sophia.git", rev = "e51a17b8681123a53ca3f7b632c35dbe71e3a4ee" }
# The public render-node measurement and buffer allocator (feature gbm-probe),
# for the probe's GPU variant only, as the old probe used them.
sophia-backend-live = { git = "https://github.com/sophia-org/sophia.git", rev = "e51a17b8681123a53ca3f7b632c35dbe71e3a4ee" }
