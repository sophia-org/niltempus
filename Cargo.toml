[workspace]
members = ["crates/xtask", "crates/live-tests"]
resolver = "3"

[workspace.package]
authors = ["Mason Austin Green"]
edition = "2024"
license = "BSD-3-Clause"
version = "0.1.0"
rust-version = "1.96"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
new_without_default = "allow"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }
sha2 = "0.10.9"
# Sophia's public crates, pinned to one revision by its canonical URL. No
# sibling path is ever named: tools/provision.sh redirects the URL to a local
# clone only while fetching, and every gate then builds --offline --locked
# from an explicit private CARGO_HOME outside this tree. See pins/sophia.toml.
# The public session-log record reader (seam B). Only an exact git checkout
# builds this package (its conformance-host bins use ../ paths), so
# provisioning fetches into a private CARGO_HOME rather than `cargo vendor`.
sophia-conformance = { git = "https://github.com/sophia-org/sophia.git", rev = "d20faf3709ae21d94491f7a628ac9a4a86619cdf" }
sophia-protocol = { git = "https://github.com/sophia-org/sophia.git", rev = "d20faf3709ae21d94491f7a628ac9a4a86619cdf" }
sophia-runtime = { git = "https://github.com/sophia-org/sophia.git", rev = "d20faf3709ae21d94491f7a628ac9a4a86619cdf" }
