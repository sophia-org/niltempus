[package]
name = "xtask"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# The `cargo xtask` alias (`run --package xtask --`) must resolve to this
# binary; the package also ships the active-session-preflight checker.
default-run = "xtask"

[dependencies]
rustix = { workspace = true, features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
sophia-conformance.workspace = true

[dev-dependencies]
sophia-config.workspace = true

[lints]
workspace = true
