Section "ServerFlags"
 Option "AutoAddGPU" "false"
EndSection
Section "Device"
 Identifier "gpu"
 Driver "modesetting"
 BusID "PCI:3:0:0"
 Option "kmsdev" "/dev/dri/card0"
 Option "AccelMethod" "glamor"
 Option "TearFree" "false"
 Option "VariableRefresh" "false"
 Option "PageFlip" "false"
EndSection
Section "Screen"
 Identifier "screen"
 Device "gpu"
 DefaultDepth 24
EndSection
