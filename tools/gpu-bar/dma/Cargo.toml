# Arm G (producer-completed DMA-BUF over files, r10), run by current Sophia
# master. Its own workspace and lock; the SDK pin is Lom's. See ../PROVENANCE.txt.
[package]
name = "gpu-bar-dma"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "BSD-3-Clause"
publish = false

[workspace]

[dependencies]
imaging = "0.0.1"
rustix = { version = "1.1", default-features = false, features = ["std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Matched-GPU prototype only: signed local pin, not for publication or packaging.
sophia-shell-gpu = { git = "file:///home/niltempus/dev/lom", rev = "1a0dc2329e18fe17f9bdf08e0d9ddcb03f57fbc7" }
sophia-shell-protocol = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "0706ea2c78cd16ba59ed209620354f30a2c78906" }
sophia-shell-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "0706ea2c78cd16ba59ed209620354f30a2c78906" }
sophia-launch-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "0706ea2c78cd16ba59ed209620354f30a2c78906" }
sophia-9p-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "0706ea2c78cd16ba59ed209620354f30a2c78906" }
sophia-image-producer = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "0706ea2c78cd16ba59ed209620354f30a2c78906" }
