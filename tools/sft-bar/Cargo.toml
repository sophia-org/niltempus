[package]
name = "sft-bar"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[features]
experimental-frame-transactions = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1.1", features = ["process", "time", "event"] }
sophia-shell-protocol = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "fd9330b64fb415dab8daacb769bcca835b546661" }
sophia-shell-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "fd9330b64fb415dab8daacb769bcca835b546661" }
sophia-launch-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "fd9330b64fb415dab8daacb769bcca835b546661" }
sophia-9p-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "fd9330b64fb415dab8daacb769bcca835b546661" }
sophia-image-producer = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "fd9330b64fb415dab8daacb769bcca835b546661" }

[dev-dependencies]
host-protocol = { package = "sophia-protocol", git = "https://github.com/sophia-org/sophia.git", rev = "2fa54bd8469cf4a68a9531c1a0142dc2b90064b7" }
sophia-config = { git = "https://github.com/sophia-org/sophia.git", rev = "2fa54bd8469cf4a68a9531c1a0142dc2b90064b7" }
sophia-session = { git = "https://github.com/sophia-org/sophia.git", rev = "2fa54bd8469cf4a68a9531c1a0142dc2b90064b7", features = ["experimental-native-frame-transaction"] }
sophia-runtime = { git = "https://github.com/sophia-org/sophia.git", rev = "2fa54bd8469cf4a68a9531c1a0142dc2b90064b7", features = ["experimental-native-frame-transaction"] }
sophia-9p = { git = "https://github.com/sophia-org/sophia.git", rev = "2fa54bd8469cf4a68a9531c1a0142dc2b90064b7" }

[profile.dev]
debug = "line-tables-only"
