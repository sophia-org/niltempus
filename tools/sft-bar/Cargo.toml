[package]
name = "sft-bar"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[features]
experimental-frame-transactions = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1.1", features = ["process", "time", "event"] }
sophia-shell-protocol = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "564be8c7a6c20b3100fd6345b2df7aa0b542737a" }
sophia-shell-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "564be8c7a6c20b3100fd6345b2df7aa0b542737a" }
sophia-launch-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "564be8c7a6c20b3100fd6345b2df7aa0b542737a" }
sophia-9p-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "564be8c7a6c20b3100fd6345b2df7aa0b542737a" }
sophia-image-producer = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "564be8c7a6c20b3100fd6345b2df7aa0b542737a" }

[dev-dependencies]
host-protocol = { package = "sophia-protocol", git = "https://github.com/sophia-org/sophia.git", rev = "f3dd02fae087de08fe4b1f6c039227f669d8ae52" }
sophia-config = { git = "https://github.com/sophia-org/sophia.git", rev = "f3dd02fae087de08fe4b1f6c039227f669d8ae52" }
sophia-session = { git = "https://github.com/sophia-org/sophia.git", rev = "f3dd02fae087de08fe4b1f6c039227f669d8ae52", features = ["experimental-native-frame-transaction"] }
sophia-runtime = { git = "https://github.com/sophia-org/sophia.git", rev = "f3dd02fae087de08fe4b1f6c039227f669d8ae52", features = ["experimental-native-frame-transaction"] }
sophia-9p = { git = "https://github.com/sophia-org/sophia.git", rev = "f3dd02fae087de08fe4b1f6c039227f669d8ae52" }

[profile.dev]
debug = "line-tables-only"
